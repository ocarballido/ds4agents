# G09: comprobaciones en cada push y pull request (build, contenido, tokens y pruebas).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tools/ci-step.sh npm test
      - run: tools/ci-step.sh npm run check:tokens
      - run: tools/ci-step.sh npm run build
      - run: tools/ci-step.sh npm run check:content
